id: io.github.agustingv.sxpilot
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
command: sxpilot
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Forward the host SSH agent.
  - --socket=ssh-auth
  # Keys, config and known_hosts used by ssh/sftp.
  - --filesystem=~/.ssh:create
  # Fallback for keyrings when the Secret portal is not available.
  - --talk-name=org.freedesktop.secrets
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/gir-1.0
  - /share/vala
  - '*.la'
  - '*.a'
modules:
  # The GNOME runtime does not ship VTE.
  - name: vte
    buildsystem: meson
    config-opts:
      - -Dgtk3=false
      - -Dgtk4=true
      - -Dgir=true
      - -Dvapi=true
      - -Ddocs=false
      - -Dglade=false
      - -Dapp=false
      - -D_systemd=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/vte/0.84/vte-0.84.0.tar.xz
        sha256: 0414e31583836aeb7878da25f67c515f7e8879917ecc37c92e26b83e8d8fc3e3
      # The release tarball already vendors its meson subprojects
      # (simdutf, fast_float, fmt), so nothing is downloaded at build time.

  - name: sxpilot
    buildsystem: meson
    sources:
      - type: dir
        path: .
        skip:
          - build
          - _build
          - .flatpak-builder
          - .git
